<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pill sign-up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="code-with-nazia.css">
</head>
<body>
<div class="pill" id="pill">
  <div class="icon under" id="icon2"></div>
  <div class="icon" id="icon"></div>
  <label class="field" id="field">
    <span class="lbl" id="lbl">Name</span>
    <input id="inp" autocomplete="off" spellcheck="false" aria-labelledby="lbl">
  </label>
  <button class="go" id="go" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
  <button class="msg" id="msg" type="button" tabindex="-1"></button>
</div>
<span id="ruler" style="position:absolute;visibility:hidden;white-space:pre;font:inherit"></span>

<script>
const ICONS={
 user:'<svg viewBox="0 0 24 24"><path d="M12 12.5c2.6 0 4.3-2 4.3-4.8S14.6 3 12 3 7.7 4.9 7.7 7.7s1.7 4.8 4.3 4.8zM4 20.5c0-3.2 3-4.8 5-5.3 1 .6 2 .9 3 .9s2-.3 3-.9c2 .5 5 2.1 5 5.3z"/></svg>',
 mail:'<svg viewBox="0 0 24 24"><path d="M3 5h18c.6 0 1 .4 1 1v.4l-10 6.6L2 6.4V6c0-.6.4-1 1-1zM2 8.5l10 6.5 10-6.5V18c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/></svg>',
 lock:'<svg viewBox="0 0 24 24"><path d="M12 2a4.5 4.5 0 0 0-4.5 4.5V10H6c-.6 0-1 .4-1 1v9c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-9c0-.6-.4-1-1-1h-1.500V6.500A4.5 4.5 0 0 0 12 2zm0 2a2.500 2.500 0 0 1 2.500 2.500V10h-5V6.500A2.500 2.500 0 0 1 12 4zm0 8.500a1.700 1.700 0 0 1 .8 3.200V18h-1.600v-2.300a1.700 1.700 0 0 1 .8-3.200z"/></svg>'
};
const STEPS=[
 {label:'Name',type:'text',icon:'user'},
 {label:'Email',type:'text',icon:'mail',mode:'email'},
 {label:'Password',type:'password',icon:'lock'}
];
const $=id=>document.getElementById(id);
const pill=$('pill'),icon=$('icon'),icon2=$('icon2'),field=$('field'),lbl=$('lbl'),inp=$('inp'),go=$('go'),msg=$('msg'),ruler=$('ruler');
let step=0,busy=false,mode='form',timers=[];
const MIN=220-144; // pill starts at 220px

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
function anim(ms,fn,e){return new Promise(res=>{const t0=performance.now();(function f(n){const t=Math.min(1,(n-t0)/ms);fn((e||ease)(t));t<1?requestAnimationFrame(f):res()})(t0)})}
const q=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function inputW(){
  ruler.style.fontSize=getComputedStyle(inp).fontSize;
  ruler.style.letterSpacing=inp.type==='password'?'.12em':'normal';
  ruler.textContent=inp.type==='password'?'•'.repeat(inp.value.length):inp.value;
  const w=Math.max(lbl.offsetWidth+2,MIN)+ruler.offsetWidth;
  return Math.min(w,window.innerWidth*.96-150);
}
function layout(){const w=inputW();inp.style.width=w+'px';pill.style.width=(w+144)+'px'}
function msgW(text){msg.textContent=text;return msg.offsetWidth+76}
function shake(){pill.classList.remove('shake');void pill.offsetWidth;pill.classList.add('shake')}

function setStep(i){
  step=i;const s=STEPS[i];
  lbl.textContent=s.label;inp.type=s.type;inp.inputMode=s.mode||'text';inp.value='';
  icon.innerHTML=ICONS[s.icon];
}

async function next(){
  if(busy||mode!=='form')return;
  const v=inp.value.trim();
  if(!v||(STEPS[step].icon==='mail'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))){shake();return}
  busy=true;
  const last=step===STEPS.length-1;
  const W0=pill.offsetWidth;
  pill.style.transition='none';
  const fw=field.offsetWidth;

  if(!last){
    icon2.innerHTML=ICONS[STEPS[step+1].icon];icon2.style.opacity=1;
    await anim(850,p=>{
      const tr=p*(W0-70);
      field.style.clipPath=`inset(-10px 0 -10px ${Math.max(0,62.5+tr-78+8)}px)`;
    // icon moves right, erasing text as it passes
      icon.style.transform=`translateX(${tr}px)`;
    });
    // swap: next icon is already revealed at left; new field fades in
    field.style.transition='none';field.style.opacity=0;field.style.clipPath='';
    icon.style.transition='none';icon.style.transform='';
    setStep(step+1);
    icon2.style.opacity=0;
    void field.offsetWidth;
    pill.style.transition='';field.style.transition='';icon.style.transition='';
    layout();field.style.opacity=1;
    inp.focus({preventScroll:true});
  }else{
    const Wf=msgW('Welcome');
    go.style.opacity=0;icon.style.transition='none';
    msg.style.transition='none';msg.style.opacity=1;msg.style.clipPath='inset(-10px 100% -10px 0)';
    pill.classList.add('welcome');
    field.style.transition='none';
    await anim(700,p=>{
      field.style.opacity=1-Math.min(1,p*3.5);
      const W=lerp(W0,Wf,p),tr=p*(Wf-70);
      pill.style.width=W+'px';
      icon.style.transform=`translateX(${tr}px)`;
      icon.style.opacity=1-Math.min(1,Math.max(0,(p-.5)/.45));
      const ex=62.5+tr;                                  // icon right edge
      const tw=msg.offsetWidth,sx=(W-3-tw)/2;
      msg.style.clipPath=`inset(-10px ${Math.min(tw,Math.max(0,sx+tw-ex))}px -10px 0)`;
      const rightLimit=W-3-12;
      field.style.clipPath=`inset(-10px ${Math.max(0,78+fw-rightLimit)}px -10px ${Math.max(0,ex-78+8)}px)`;
    },q);
    field.style.opacity=0;field.style.clipPath='';
    icon.style.opacity=0;
    msg.style.clipPath='';msg.style.transition='';
    pill.style.transition='';
    mode='welcome';
    timers=[setTimeout(()=>pill.classList.add('bare'),900),setTimeout(showCta,1900)];
  }
  busy=false;
}

function showCta(){
  msg.style.opacity=0;
  timers.push(setTimeout(()=>{
    pill.classList.remove('welcome','bare');pill.classList.add('cta');
    pill.style.width=msgW('Sign Up')+'px';
    msg.style.pointerEvents='auto';msg.tabIndex=0;msg.style.opacity=1;msg.focus({preventScroll:true});
    mode='cta';
  },260));
}

async function restart(){
  if(mode!=='cta'||busy)return;
  busy=true;
  msg.style.opacity=0;msg.style.pointerEvents='none';msg.tabIndex=-1;
  await wait(250);
  pill.classList.remove('cta');
  icon.style.transition='none';field.style.transition='none';
  icon.style.opacity=0;field.style.opacity=0;icon.style.transform='';
  setStep(0);go.style.opacity=1;
  void pill.offsetWidth;
  layout();
  await wait(300);
  icon.style.transition='';field.style.transition='';
  icon.style.opacity=1;field.style.opacity=1;
  mode='form';busy=false;
  inp.focus({preventScroll:true});
}

inp.addEventListener('input',layout);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();next()}});
go.addEventListener('click',next);
pill.addEventListener('click',restart);
document.fonts.ready.then(()=>{setStep(0);layout();inp.focus({preventScroll:true})});
</script>
</body>
</html>
